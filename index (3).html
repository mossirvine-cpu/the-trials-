// ---------- little helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const overlap = (a, b) => Math.abs(a.x - b.x) < (a.w + b.w) / 2 && Math.abs(a.y - b.y) < (a.h + b.h) / 2;
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

// ---------- sprites ----------
const sprCache = {};
function makeSprite(art, over) {
  const own = !Array.isArray(art);
  const rows = own ? art.rows : art;
  const pal = own ? art.pal : PALETTE;
  const w = own ? Math.max(...rows.map(r => r.length)) : 16;
  const h = own ? rows.length : 16;
  const c = makeCanvas(w, h);
  const x = c.getContext('2d');
  for (let j = 0; j < h; j++) {
    const row = rows[j] || '';
    for (let i = 0; i < w; i++) {
      const ch = row[i];
      if (!ch || ch === '.' || ch === ' ') continue;
      const col = (over && over[ch]) || pal[ch];
      if (!col) continue;
      x.fillStyle = col;
      x.fillRect(i, j, 1, 1);
    }
  }
  return c;
}
function flipCanvas(c) {
  const f = makeCanvas(c.width, c.height);
  const x = f.getContext('2d');
  x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(c, 0, 0);
  return f;
}
function spr(name, over, key) {
  const k = name + '|' + (key || '');
  if (!sprCache[k]) {
    const s = makeSprite(ART[name] || [], over);
    sprCache[k] = { r: s, l: flipCanvas(s) };
  }
  return sprCache[k];
}
// The floor uses softer, darker colours than the walls so it sits back
// and lets the knight and monsters stand out. Change these to tweak it!
const FLOOR_PAL = Object.assign({}, MOSSY_PAL, {
  'L': '#4b4d48', // floor stone (was very bright)
  'N': '#3f413c', // gaps between floor stones, only a little darker
  'A': '#454742', // little cracks in the floor
});
function mossyTile(kind, h) {
  const list = MOSSY[kind];
  const i = h % list.length;
  const k = 'mossy_' + kind + i;
  if (!sprCache[k]) sprCache[k] = { r: makeSprite({ rows: list[i], pal: kind === 'floors' ? FLOOR_PAL : MOSSY_PAL }) };
  return sprCache[k].r;
}
// size is how big a normal 16-pixel drawing would be. Bigger or smaller
// drawings keep the same pixel size, so everything matches.
function drawSpr(s, x, y, size, flip) {
  const img = flip ? s.l : s.r;
  const ps = size / 16;
  const w = (img.width || 16) * ps, h = (img.height || 16) * ps;
  ctx.drawImage(img, Math.round(x - w / 2), Math.round(y - h / 2), w, h);
}
function monsterSprite(type, scheme, frame) {
  const M = MONSTERS[type];
  const name = M.frames[frame % M.frames.length];
  if (M.own) return spr(name, null, type);
  let over;
  if (M.colors) over = M.colors;
  else { const s = M.schemes[scheme] || M.schemes[0]; over = { '1': s[0], '2': s[1] || s[0], '3': s[2] || s[0] }; }
  return spr(name, over, type + scheme);
}
function weaponSprite(key) { const w = WEAPONS[key]; return w.icon ? spr(w.icon, w.colors, key) : null; }
function potionSprite(type) { return spr('potion', POTIONS[type].colors, 'p' + type); }

let actx = null, master = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain();
    master.connect(actx.destination);
    applyVolume();
  } catch (e) { actx = null; }
}
function applyVolume() { if (master) master.gain.value = [0, 0.06, 0.13, 0.22][settings.volume]; }
function tone(f, d, type, v, slide, isMusic) {
  if (!actx || !master) return;
  if (isMusic ? !settings.music : !settings.sound) return;
  try {
    const t0 = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t0 + d);
    g.gain.setValueAtTime(v || 0.5, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + d);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + d + 0.02);
  } catch (e) {}
}

// ---------- map helpers ----------
function tile(x, y) { if (x < 0 || y < 0 || x >= MW || y >= MH) return WALL; return map[y * MW + x]; }

  for (let px = x0; ; px += T / 2) {
    if (px > x1) px = x1;

      if (solidAt(px, py)) return true;
      if (py === y1) break;

}
function moveEntity(e, dx, dy, ghost) {

    e.y = clamp(e.y + dy, T * 1.5, (MH - 1.5) * T);

// ---------- making a dungeon ----------
function genDungeon(d) {
  const rng = mulberry32(gameSeed + d * 7919);
  const R = (a, b) => a + Math.floor(rng() * (b - a + 1));
  map = new Uint8Array(MW * MH);
  hidden = new Set(); secrets = {};
  monsters = []; items = []; chests = []; projectiles = []; particles = []; floaters = []; torches = [];
  exitObj = null; boss = null; arena = 'waiting'; arenaT = 0; gates = [];

  startRoom = { x: R(2, 5), y: R(3, MH - 12), w: 10, h: 8 };
  bossRoom = { x: MW - 17, y: R(3, MH - 15), w: 15, h: 12 };
  rooms = [startRoom, bossRoom];
  const mids = [];
  const want = Math.min(9, 5 + Math.floor(d / 2));
  for (let tries = 0; tries < 800 && mids.length < want; tries++) {
    const w = R(7, 12), h = R(6, 9);
    const r = { x: R(2, MW - w - 3), y: R(2, MH - h - 3), w, h };
    if (rooms.every(o => !(r.x < o.x + o.w + 2 && r.x + r.w + 2 > o.x && r.y < o.y + o.h + 2 && r.y + r.h + 2 > o.y))) {
      rooms.push(r); mids.push(r);
    }
  }
  const carve = (x, y) => { if (x >= 1 && y >= 1 && x < MW - 1 && y < MH - 1) map[y * MW + x] = FLOOR; };
  for (const r of rooms) for (let y = r.y; y < r.y + r.h; y++) for (let x = r.x; x < r.x + r.w; x++) carve(x, y);

  // join the rooms together with corridors
  const cen = r => ({ x: r.x + Math.floor(r.w / 2), y: r.y + Math.floor(r.h / 2) });
  const chain = [startRoom];
  const left = mids.slice();
  let cur = startRoom;
  while (left.length) {
    left.sort((a, b) => dist(cen(cur), cen(a)) - dist(cen(cur), cen(b)));
    cur = left.shift();
    chain.push(cur);
  }
  chain.push(bossRoom);
  for (let i = 0; i < chain.length - 1; i++) {
    const a = cen(chain[i]), b = cen(chain[i + 1]);
    if (rng() < 0.5) {
      for (let x = Math.min(a.x, b.x); x <= Math.max(a.x, b.x); x++) { carve(x, a.y); carve(x, a.y + 1); }
      for (let y = Math.min(a.y, b.y); y <= Math.max(a.y, b.y) + 1; y++) { carve(b.x, y); carve(b.x + 1, y); }
    } else {
      for (let y = Math.min(a.y, b.y); y <= Math.max(a.y, b.y); y++) { carve(a.x, y); carve(a.x + 1, y); }
      for (let x = Math.min(a.x, b.x); x <= Math.max(a.x, b.x) + 1; x++) { carve(x, b.y); carve(x, b.y + 1); }
    }
  }

  // player, shop
  player.x = (startRoom.x + startRoom.w / 2) * T;
  player.y = (startRoom.y + startRoom.h - 1.5) * T;
  player.kbx = player.kby = 0;
  shopObj = { x: (startRoom.x + startRoom.w / 2) * T, y: (startRoom.y + 1.3) * T, w: 60, h: 60 };

  // monsters, chests and secret rooms
  const types = monstersFor(d);
  for (const r of mids) {
    const n = Math.min(9, 2 + Math.floor(d * 0.6) + R(0, 2));
    for (let i = 0; i < n; i++) {
      const tx = R(r.x + 1, r.x + r.w - 2), ty = R(r.y + 1, r.y + r.h - 2);
      spawnMonster(pick(types), (tx + 0.5) * T, (ty + 0.5) * T, d);
    }
    if (rng() < 0.45) {
      const tx = R(r.x + 1, r.x + r.w - 2), ty = R(r.y + 1, r.y + r.h - 2);
      chests.push({ x: (tx + 0.5) * T, y: (ty + 0.5) * T, w: 36, h: 30, open: false });
    }
  }
  for (const r of mids) if (rng() < 0.6) trySecret(r, R, rng);
  // carved stones with old messages
  loreStones = [];
  const lines = CARVINGS[d - 1] || [];
  const spots = mids.slice().sort(() => rng() - 0.5);
  lines.forEach((line, i) => {
    const r = spots[i % Math.max(1, spots.length)] || startRoom;
    for (let k = 0; k < 20; k++) {
      const x = (R(r.x + 1, r.x + r.w - 2) + 0.5) * T, y = (R(r.y + 1, r.y + r.h - 2) + 0.5) * T;
      if (chests.some(c => Math.hypot(c.x - x, c.y - y) < T * 1.5) || loreStones.some(o => Math.hypot(o.x - x, o.y - y) < T * 2)) continue;
      loreStones.push({ x, y, text: line, seed: k + i * 7 });
      break;
    }
  });

  // the boss
  // the boss waits until you walk into its arena (see updateArena)
  for (let y = bossRoom.y - 1; y <= bossRoom.y + bossRoom.h; y++) for (let x = bossRoom.x - 1; x <= bossRoom.x + bossRoom.w; x++) {
    const edge = y === bossRoom.y - 1 || y === bossRoom.y + bossRoom.h || x === bossRoom.x - 1 || x === bossRoom.x + bossRoom.w;
    if (edge && tile(x, y) === FLOOR) gates.push(y * MW + x);
  }

  // torches on walls
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    if (tile(x, y) === WALL && isOpen(x, y + 1) && ((x * 7 + y * 13) % 11 === 0)) torches.push({ x: (x + 0.5) * T, y: (y + 0.55) * T, seed: x + y });
  }

  makeShop(d);
  renderMap();
  cam.x = clamp(player.x - W / 2, 0, MW * T - W);
  cam.y = clamp(player.y - H / 2, 0, MH * T - H);
  for (const c of companions) { c.x = player.x + rnd(-30, 30); c.y = player.y + rnd(-20, 20); }
}

function trySecret(r, R, rng) {
  const sides = ['top', 'bottom', 'left', 'right'].sort(() => rng() - 0.5);
  for (const s of sides) {
    for (let k = 0; k < 6; k++) {
      let cx, cy, sx, sy;
      if (s === 'top')         { cx = R(r.x + 1, r.x + r.w - 2); cy = r.y - 1; sx = cx; sy = cy - 1; }
      else if (s === 'bottom') { cx = R(r.x + 1, r.x + r.w - 2); cy = r.y + r.h; sx = cx; sy = cy + 1; }
      else if (s === 'left')   { cy = R(r.y + 1, r.y + r.h - 2); cx = r.x - 1; sx = cx - 1; sy = cy; }
      else                     { cy = R(r.y + 1, r.y + r.h - 2); cx = r.x + r.w; sx = cx + 1; sy = cy; }
      if (sx < 2 || sy < 2 || sx > MW - 3 || sy > MH - 3) continue;
      if (tile(cx, cy) !== WALL) continue;
      let ok = true;
      for (let yy = sy - 1; yy <= sy + 1 && ok; yy++) for (let xx = sx - 1; xx <= sx + 1; xx++) {
        if (xx === cx && yy === cy) continue;
        if (tile(xx, yy) !== WALL) { ok = false; break; }
      }
      if (ok) {
        if (s === 'top' || s === 'bottom') { if (tile(cx - 1, cy) !== WALL || tile(cx + 1, cy) !== WALL) ok = false; }
        else if (tile(cx, cy - 1) !== WALL || tile(cx, cy + 1) !== WALL) ok = false;
      }
      if (!ok) continue;
      map[cy * MW + cx] = CRACK;
      map[sy * MW + sx] = FLOOR;
      hidden.add(sy * MW + sx);
      const chest = { x: (sx + 0.5) * T, y: (sy + 0.5) * T, w: 36, h: 30, open: false, secret: true, hidden: true };
      chests.push(chest);
      secrets[cy * MW + cx] = { sx, sy, chest };
      return true;
    }
  }
  return false;
}

function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return (h ^ (h >>> 16)) >>> 0; }
function renderTile(tx, ty) {
  const px = tx * T, py = ty * T;
  if (tile(tx, ty) === GATE) {
    mapCtx.drawImage(mossyTile('floors', hash(tx, ty)), px, py, T, T);
    mapCtx.drawImage(spr('gate').r, px, py, T, T);
    return;
  }
  mapCtx.fillStyle = '#080a07';
  mapCtx.fillRect(px, py, T, T);
  const h = hash(tx, ty);
  if (isOpen(tx, ty)) {
    mapCtx.drawImage(mossyTile('floors', h), px, py, T, T);
    return;
  }
  let edge = false;
  for (let yy = -1; yy <= 1 && !edge; yy++) for (let xx = -1; xx <= 1; xx++) if (isOpen(tx + xx, ty + yy)) { edge = true; break; }
  if (!edge) return;
  mapCtx.drawImage(mossyTile('walls', h), px, py, T, T);
  if (tile(tx, ty) === CRACK) { mapCtx.drawImage(spr('crack').r, px, py, T, T); return; }
}
function renderMap() {
  mapCanvas = makeCanvas(MW * T, MH * T);
  mapCtx = mapCanvas.getContext('2d');
  mapCtx.imageSmoothingEnabled = false;
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) renderTile(x, y);
}
function breakCrack(tx, ty) {
  const key = ty * MW + tx;
  map[key] = FLOOR;
  const s = secrets[key];
  if (s) { hidden.delete(s.sy * MW + s.sx); s.chest.hidden = false; delete secrets[key]; }
  for (let y = ty - 2; y <= ty + 2; y++) for (let x = tx - 2; x <= tx + 2; x++) if (x >= 0 && y >= 0 && x < MW && y < MH) renderTile(x, y);
  for (let i = 0; i < 18; i++) particles.push({ x: (tx + 0.5) * T, y: (ty + 0.5) * T, vx: rnd(-200, 200), vy: rnd(-200, 200), life: rnd(0.4, 0.8), color: pick(['#6e7468', '#4e534a', '#8c9286', '#4f8a3a']), s: ri(4, 8) });
  SFX.crumble();
  later(() => SFX.secret(), 200);
  shake = 6;
  showBanner('A secret room!', 2.5);
}

// ---------- monsters ----------
function spawnMonster(type, x, y, d, scheme) {
  const M = MONSTERS[type];
  if (scheme === undefined) scheme = M.schemes ? Math.floor(Math.random() * M.schemes.length) : 0;
  const m = {
    type, scheme, x, y, w: M.hit, h: M.hit,
    hp: M.hp * (1 + 0.4 * (d - 1)), dmg: M.dmg + Math.floor((d - 1) / 3), speed: M.speed * (1 + 0.04 * (d - 1)),
    ai: M.ai, t: Math.random() * 10, cd: rnd(1, 3), flash: 0, lunge: 0, windup: 0, lungeRest: rnd(0.5, 2), lvx: 0, lvy: 0, kbx: 0, kby: 0, slowT: 0, wx: 0, wy: 0, nextWander: 0, boss: false,
  };
  m.maxHp = m.hp;
  monsters.push(m);
  return m;
}
function spawnBoss(d) {
  const B = BOSSES[d - 1];
  const m = spawnMonster(B.type, (bossRoom.x + bossRoom.w / 2) * T, (bossRoom.y + bossRoom.h / 2) * T, d, B.scheme);
  m.boss = true; m.final = !!B.final; m.name = B.name;
  const BM = MONSTERS[B.type];
  m.w = BM.hitW || (B.final ? 100 : 104);
  m.h = BM.hitH || (B.final ? 100 : 104);
  m.hp = m.maxHp = B.final ? 280 : Math.round(30 * (1 + 0.6 * (d - 1)));
  m.dmg = 2 + Math.floor(d / 2);
  m.speed = B.final ? 95 : 55 + d * 4;
  m.ai = 'chase';
  m.cd = 2.5; m.active = false; m.charge = 0; m.cvx = 0; m.cvy = 0;
  boss = m;
}
function monsterColor(m) {
  const M = MONSTERS[m.type];
  if (M.own) return M.color;
  if (M.colors) return '#9b59d0';
  if (m.type === 'skeleton') return '#ece4cc';
  return (M.schemes[m.scheme] || M.schemes[0])[0];
}

function updateMonster(m, dt) {
  m.t += dt;
  m.flash = Math.max(0, m.flash - dt);
  m.slowT = Math.max(0, m.slowT - dt);
  const phase = m.ai === 'phase';
  if (m.kbx || m.kby) {
    moveEntity(m, m.kbx * dt, m.kby * dt, phase);
    m.kbx *= 0.82; m.kby *= 0.82;
    if (Math.abs(m.kbx) < 5) m.kbx = 0;
    if (Math.abs(m.kby) < 5) m.kby = 0;
  }
  const dx = player.x - m.x, dy = player.y - m.y, dd = Math.hypot(dx, dy) || 1;
  if (m.boss) { updateBoss(m, dt, dx, dy, dd); return; }
  const spd = m.speed * (m.slowT > 0 ? 0.45 : 1);
  let mx = 0, my = 0;
  // wind up and lunge (walking monsters only, not fliers)
  const canLunge = (m.ai === 'chase' || m.ai === 'hop') && !MONSTERS[m.type].flying;
  m.lungeRest -= dt;
  if (m.windup > 0) {
    m.windup -= dt;
    m.moving = false;
    if (m.windup <= 0) {
      m.lunge = LUNGE_TIME;
      m.lvx = dx / dd * spd * LUNGE_SPEED; m.lvy = dy / dd * spd * LUNGE_SPEED;
    }
    if (overlap(m, player)) hurtPlayer(m.dmg, m.x, m.y);
    return;
  }
  if (m.lunge > 0) {
    m.lunge -= dt;
    moveEntity(m, m.lvx * dt, m.lvy * dt);
    m.moving = true;
    if (Math.random() < 0.5) particles.push({ x: m.x + rnd(-8, 8), y: m.y + 12, vx: -m.lvx * 0.1, vy: -m.lvy * 0.1, life: 0.25, color: '#6e7468', s: 4 });
    if (m.lunge <= 0) m.lungeRest = LUNGE_REST + rnd(0, 0.8);
    if (overlap(m, player)) hurtPlayer(m.dmg + 1, m.x, m.y);
    return;
  }
  if (canLunge && dd < LUNGE_RANGE && m.lungeRest <= 0 && m.slowT <= 0) {
    m.windup = LUNGE_WINDUP;
    SFX.windup();
    return;
  }
  if (dd > 330) {
    if (m.t > m.nextWander) {
      m.nextWander = m.t + rnd(1, 3);
      const a = rnd(0, Math.PI * 2);
      m.wx = Math.random() < 0.4 ? 0 : Math.cos(a);
      m.wy = Math.random() < 0.4 ? 0 : Math.sin(a);
    }
    mx = m.wx * spd * 0.35; my = m.wy * spd * 0.35;
  } else {
    switch (m.ai) {
      case 'hop':
        if ((m.t * 1.6) % 1 < 0.5) { mx = dx / dd * spd * 1.6; my = dy / dd * spd * 1.6; }
        break;
      case 'flutter':
        mx = dx / dd * spd + Math.cos(m.t * 6) * spd * 0.7;
        my = dy / dd * spd + Math.sin(m.t * 7) * spd * 0.7;
        break;
      case 'shooter':
        if (dd < 170) { mx = -dx / dd * spd; my = -dy / dd * spd; }
        else if (dd > 260) { mx = dx / dd * spd; my = dy / dd * spd; }
        else { mx = -dy / dd * spd * 0.6; my = dx / dd * spd * 0.6; }
        m.cd -= dt;
        if (m.cd <= 0) {
          m.cd = Math.max(1.2, 2.4 - dungeon * 0.08);
          projectiles.push({ x: m.x, y: m.y, vx: dx / dd * 230, vy: dy / dd * 230, dmg: m.dmg, friendly: false, color: '#ff7a2a', r: 9, life: 3, rot: 0 });
          SFX.shoot();
        }
        break;
      default: // chase and phase
        if (m.type === 'spider' && Math.sin(m.t * 3) > 0.75) break;
        mx = dx / dd * spd; my = dy / dd * spd;
    }
  }
  moveEntity(m, mx * dt, my * dt, phase);
  m.moving = mx !== 0 || my !== 0;
  if (overlap(m, player)) hurtPlayer(m.dmg, m.x, m.y);
}

function updateBoss(m, dt, dx, dy, dd) {
  if (!m.active) {
    if (inRoom(player, bossRoom) || dd < 380) {
      m.active = true;
      showBanner(m.name + '!', 2.5);
      SFX.roar(); shake = 10;
    } else return;
  }
  m.cd -= dt;
  if (m.charge > 0) {
    m.charge -= dt;
    moveEntity(m, m.cvx * dt, m.cvy * dt);
  } else {
    const s = m.speed * (m.slowT > 0 ? 0.5 : 1);
    moveEntity(m, dx / dd * s * dt, dy / dd * s * dt);
  }
  m.moving = true;
  if (m.cd <= 0) {
    const angry = m.hp < m.maxHp / 2;
    m.cd = Math.max(1.3, 3.6 - dungeon * 0.18) * (angry ? 0.7 : 1);
    const moves = ['burst', 'charge', 'summon'];
    if (m.final) moves.push('burst', 'spiral');
    const mv = pick(moves);
    const col = monsterColor(m);
    if (mv === 'burst' || mv === 'spiral') {
      const n = 8 + dungeon + (m.final ? 6 : 0);
      for (let i = 0; i < n; i++) {
        const a = i / n * Math.PI * 2 + m.t;
        const sp = 170 + dungeon * 10;
        projectiles.push({ x: m.x, y: m.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, dmg: Math.ceil(m.dmg / 2), friendly: false, color: col, r: 10, life: 3.5, rot: 0 });
      }
      if (mv === 'spiral') later(() => {
        if (m.dead) return;
        for (let i = 0; i < n; i++) {
          const a = (i + 0.5) / n * Math.PI * 2 + m.t;
          projectiles.push({ x: m.x, y: m.y, vx: Math.cos(a) * 200, vy: Math.sin(a) * 200, dmg: Math.ceil(m.dmg / 2), friendly: false, color: '#d83a3a', r: 10, life: 3.5, rot: 0 });
        }
      }, 400);
      SFX.shoot();
    } else if (mv === 'charge') {
      m.cvx = dx / dd * m.speed * 5; m.cvy = dy / dd * m.speed * 5; m.charge = 0.6;
      SFX.roar();
    } else {
      const inside = monsters.filter(o => !o.boss && inRoom(o, bossRoom)).length;
      if (inside < 6) {
        for (let i = 0; i < 2; i++) {
          const type = MONSTERS[m.type].minion || (m.type === 'warden' ? pick(MONSTER_ORDER) : m.type);
          const o = spawnMonster(type, m.x + rnd(-60, 60), m.y + rnd(-60, 60), dungeon);
          if (boxSolid(o.x, o.y, o.w, o.h)) { o.x = m.x; o.y = m.y; }
        }
        showBanner(m.name + ' calls for help!', 1.5);
      }
    }
  }
  if (overlap(m, player)) hurtPlayer(m.dmg, m.x, m.y);
}

function damageMonster(m, dmg, kx, ky, knock, crit) {
  if (m.dead) return;
  m.hp -= dmg;
  m.flash = 0.12;
  if (!m.boss && m.windup > 0 && crit) { m.windup = 0; m.lungeRest = LUNGE_REST; floater(m.x, m.y - m.h / 2 - 14, 'STUNNED', '#8ae0ff'); }
  const l = Math.hypot(kx, ky) || 1;
  const kb = (m.boss ? 60 : 320) * (knock || 1);
  m.kbx = kx / l * kb; m.kby = ky / l * kb;
  if (crit) {
    floater(m.x + rnd(-8, 8), m.y - m.h / 2 - 10, 'CRIT ' + fmt(dmg), '#ffd23a', 14);
    shake = Math.max(shake, 6); hitStop = Math.max(hitStop, 0.09);
    for (let i = 0; i < 8; i++) particles.push({ x: m.x, y: m.y, vx: rnd(-240, 240), vy: rnd(-240, 240), life: 0.4, color: '#ffd23a', s: 5 });
    SFX.crit();
  } else {
    floater(m.x + rnd(-8, 8), m.y - m.h / 2, fmt(dmg), '#ffffff');
    hitStop = Math.max(hitStop, 0.035);
  }
  for (let i = 0; i < 4; i++) particles.push({ x: m.x, y: m.y, vx: rnd(-150, 150), vy: rnd(-150, 150), life: 0.35, color: monsterColor(m), s: 5 });
  SFX.hit();
  if (m.hp <= 0) { hitStop = Math.max(hitStop, 0.07); killMonster(m); }
}
function killMonster(m) {
  m.dead = true;
  for (let i = 0; i < (m.boss ? 60 : 14); i++) particles.push({ x: m.x, y: m.y, vx: rnd(-260, 260), vy: rnd(-260, 260), life: rnd(0.4, 0.9), color: pick([monsterColor(m), '#ffffff', '#1b1b24']), s: ri(4, 8) });
  SFX.kill();
  if (m.boss) { bossDefeated(m); return; }
  const d = dungeon;
  if (Math.random() < 0.55) dropCoins(m.x, m.y, ri(1, 4) + Math.floor(d * 0.8));
  if (Math.random() < 0.08) spawnItem('potion', m.x, m.y, { ptype: randomPotion() });
  if (Math.random() < 0.07) spawnItem('scrap', m.x, m.y);
  if (Math.random() < 0.04) spawnItem('weapon', m.x, m.y, { wkey: randomWeaponKey(tierFor(d)) });
}
// ---------- the boss arena ----------
function setGates(closed) {
  for (const i of gates) map[i] = closed ? GATE : FLOOR;
  for (const i of gates) {
    const gx = i % MW, gy = Math.floor(i / MW);
    for (let y = gy - 1; y <= gy + 1; y++) for (let x = gx - 1; x <= gx + 1; x++) if (x >= 0 && y >= 0 && x < MW && y < MH) renderTile(x, y);
  }
}
function updateArena(dt) {
  if (arena === 'waiting') {
    const r = bossRoom, m = 0.7 * T;
    const inside = player.x > r.x * T + m && player.x < (r.x + r.w) * T - m && player.y > r.y * T + m && player.y < (r.y + r.h) * T - m;
    if (!inside) return;
    arena = 'closing'; arenaT = 1.2;
    setGates(true);
    shake = 12; SFX.crumble();
    later(() => SFX.crumble(), 150);
    showBanner('The doors slam shut behind you...', 2);
    // buddies come in with you
    for (const c of companions) if (!inRoom(c, bossRoom)) { c.x = player.x; c.y = player.y; }
    for (const i of gates) for (let k = 0; k < 6; k++) particles.push({ x: (i % MW + 0.5) * T, y: (Math.floor(i / MW) + 0.5) * T, vx: rnd(-120, 120), vy: rnd(-120, 120), life: rnd(0.3, 0.7), color: pick(['#6e7468', '#8c9286', '#c3ccd6']), s: ri(4, 7) });
  } else if (arena === 'closing') {
    arenaT -= dt;
    if (arenaT > 0) return;
    arena = 'fight';
    spawnBoss(dungeon);
    const cx = boss.x, cy = boss.y;
    for (let k = 0; k < 50; k++) particles.push({ x: cx, y: cy, vx: rnd(-320, 320), vy: rnd(-320, 320), life: rnd(0.4, 1), color: pick([monsterColor(boss), '#1b1b24', '#ffffff']), s: ri(5, 10) });
  }
}
function bossDefeated(m) {
  arena = 'done';
  setGates(false);
  shake = 16;
  SFX.victory();
  const cx = (bossRoom.x + bossRoom.w / 2) * T, cy = (bossRoom.y + bossRoom.h / 2) * T;
  // the boss's helpers run away when it is beaten
  for (const o of monsters) if (!o.boss && inRoom(o, bossRoom)) { o.dead = true; for (let i = 0; i < 6; i++) particles.push({ x: o.x, y: o.y, vx: rnd(-100, 100), vy: rnd(-100, 100), life: 0.5, color: '#ffffff', s: 5 }); }
  if (m.final) {
    exitObj = { kind: 'door', x: cx, y: (bossRoom.y + 0.4) * T, w: 90, h: 50 };
    showBanner('The Warden is beaten! The great door is open!', 5);
    return;
  }
  chests.push({ x: cx - 3 * T, y: cy, w: 40, h: 34, open: false, boss: true });
  exitObj = { kind: 'stairs', x: cx + 3 * T, y: cy, w: 44, h: 44 };
  showBanner(m.name + ' is defeated! Open the chest, then take the stairs.', 5);
}

// ---------- items ----------
function spawnItem(kind, x, y, extra) {
  const it = Object.assign({ kind, x, y, w: 20, h: 20, vx: rnd(-160, 160), vy: rnd(-160, 160), t: 0, value: 1 }, extra || {});
  if (kind === 'weapon' && it.dur === undefined) it.dur = WEAPONS[it.wkey].dur;
  items.push(it);
  return it;
}
function dropCoins(x, y, total) {
  const n = Math.min(6, Math.max(1, Math.ceil(total / 4)));
  let left = total;
  for (let i = 0; i < n; i++) {
    const v = i === n - 1 ? left : Math.max(1, Math.floor(total / n));
    left -= v;
    if (v > 0) spawnItem('coin', x, y, { value: v });
  }
}
function updateItems(dt) {
  for (const it of items) {
    it.t += dt;
    if (it.warnT) it.warnT -= dt;
    if (it.vx || it.vy) {
      moveEntity(it, it.vx * dt, it.vy * dt);
      it.vx *= 0.9; it.vy *= 0.9;
      if (Math.abs(it.vx) < 3) it.vx = 0;
      if (Math.abs(it.vy) < 3) it.vy = 0;
    }
    const d = dist(it, player);
    if (it.kind === 'coin' && d < 110 && it.t > 0.3) {
      const l = d || 1;
      moveEntity(it, (player.x - it.x) / l * 320 * dt, (player.y - it.y) / l * 320 * dt);
    }
    if (d < 32 && it.t > 0.35) pickup(it);
  }
  items = items.filter(i => !i.dead);
}
function pickup(it) {
  switch (it.kind) {
    case 'coin':
      player.coins += it.value; SFX.coin(); floater(it.x, it.y - 10, '+' + it.value, '#f0c83c'); break;
    case 'potion':
      player.potions[it.ptype]++; SFX.potion(); floater(it.x, it.y - 10, POTIONS[it.ptype].name, '#ffffff'); break;
    case 'scrap':
      player.scrap++; SFX.coin(); floater(it.x, it.y - 10, 'Scrap metal', '#c3ccd6'); break;
    case 'heart':
      player.maxHp = Math.min(24, player.maxHp + 2); player.hp = Math.min(player.maxHp, player.hp + 2);
      SFX.victory(); floater(it.x, it.y - 10, '+1 HEART!', '#ff6a6a'); break;
    case 'weapon':
      if (player.weapons.length >= MAX_WEAPONS) {
        if (!(it.warnT > 0)) { floater(it.x, it.y - 20, 'Bag full! G drops', '#ff9a9a'); it.warnT = 2; }
        return;
      }
      player.weapons.push({ key: it.wkey, dur: it.dur });
      if (player.weapons.length === 1) player.wi = 0;
      SFX.chest(); floater(it.x, it.y - 10, WEAPONS[it.wkey].name + '!', '#9be37a'); break;
  }
  it.dead = true;
}
function openChest(c) {
  c.open = true;
  SFX.chest();
  const d = dungeon, x = c.x, y = c.y + 10;
  for (let i = 0; i < 12; i++) particles.push({ x: c.x, y: c.y, vx: rnd(-120, 120), vy: rnd(-220, -40), life: 0.7, color: pick(['#f0c83c', '#ffffff', '#ffe08a']), s: 4 });
  if (c.boss) {
    dropCoins(x, y, 40 + d * 15);
    spawnItem('weapon', x, y, { wkey: randomWeaponKey(Math.min(5, tierFor(d) + 1)) });
    spawnItem('heart', x, y);
    const B = BOSSES[d - 1];
    if (B.buddy) {
      companions.push({ type: B.buddyType || B.type, scheme: B.scheme, name: B.buddy, dmg: 1 + d * 0.7, x: c.x, y: c.y, w: 26, h: 26, cd: 0, t: Math.random() * 5, face: 1 });
      showBanner(B.buddy + ' joined your team!', 3.5);
    }
    return;
  }
  if (c.secret) {
    dropCoins(x, y, ri(20, 30) + d * 6);
    spawnItem('weapon', x, y, { wkey: randomWeaponKey(Math.min(5, tierFor(d) + (Math.random() < 0.5 ? 1 : 0))) });
    spawnItem('potion', x, y, { ptype: randomPotion() });
    return;
  }
  dropCoins(x, y, ri(8, 15) + d * 3);
  if (Math.random() < 0.4) spawnItem('potion', x, y, { ptype: randomPotion() });
  if (Math.random() < 0.3) spawnItem('scrap', x, y);
  if (Math.random() < 0.25) spawnItem('weapon', x, y, { wkey: randomWeaponKey(tierFor(d)) });
}

// ---------- the shop ----------
function makeShop(d) {
  const wk = randomWeaponKey(Math.min(5, tierFor(d) + (Math.random() < 0.4 ? 1 : 0)));
  shopStock = [
    { label: 'Health Potion', desc: 'Heals 3 hearts. Press 1 to drink.', icon: () => potionSprite('health'), price: () => 10 + d * 2, buy: () => player.potions.health++ },
    { label: 'Speed Potion', desc: 'Run super fast for 10 seconds. Press 2.', icon: () => potionSprite('speed'), price: () => 12 + d * 2, buy: () => player.potions.speed++ },
    { label: 'Strength Potion', desc: 'Double damage for 10 seconds. Press 3.', icon: () => potionSprite('strength'), price: () => 18 + d * 3, buy: () => player.potions.strength++ },
    { label: 'Scrap Metal', desc: 'Press R to fix half your weapon.', icon: () => spr('scrap'), price: () => 8 + d, buy: () => player.scrap++ },
    { label: 'Repair Weapon', desc: 'The merchant fully fixes your weapon.', icon: () => spr('hammer'),
      price: () => { const w = player.weapons[player.wi]; if (!w) return null; const miss = WEAPONS[w.key].dur - w.dur; return miss <= 0 ? null : Math.max(5, Math.ceil(miss * 0.8)); },
      buy: () => { const w = player.weapons[player.wi]; w.dur = WEAPONS[w.key].dur; } },
    { label: WEAPONS[wk].name, desc: 'A new weapon! Damage ' + WEAPONS[wk].dmg + ', lasts ' + WEAPONS[wk].dur + ' hits.', icon: () => weaponSprite(wk), price: () => 25 + WEAPONS[wk].tier * 20, once: true,
      can: () => player.weapons.length < MAX_WEAPONS || 'Your bag is full!', buy: () => { player.weapons.push({ key: wk, dur: WEAPONS[wk].dur }); if (player.weapons.length === 1) player.wi = 0; } },
    { label: 'Heart Container', desc: 'One extra heart, forever!', icon: () => spr('heart'), price: () => 40 + d * 12, once: true,
      can: () => player.maxHp < 24 || 'You have max hearts!', buy: () => { player.maxHp += 2; player.hp += 2; } },
  ];
}
function buy(item) {
  if (item.sold) { shopMsg = 'Sold out!'; shopMsgT = 1.5; SFX.error(); return; }
  const price = item.price();
  if (price === null) { shopMsg = 'Nothing to fix right now.'; shopMsgT = 1.5; SFX.error(); return; }
  if (player.coins < price) { shopMsg = 'Not enough coins!'; shopMsgT = 1.5; SFX.error(); return; }
  if (item.can) { const ok = item.can(); if (ok !== true) { shopMsg = ok; shopMsgT = 1.5; SFX.error(); return; } }
  player.coins -= price;
  item.buy();
  if (item.once) item.sold = true;
  shopMsg = 'Thank you, brave knight!'; shopMsgT = 1.5;
  SFX.coin();
}

// ---------- the player ----------
function attack() {
  if (player.cd > 0) return;
  const w = curWeapon();
  const Wd = WEAPONS[w.key];
  player.cd = Wd.cd;
  player.swingT = 0.18;
  const mult = player.strT > 0 ? 2 : 1;
  const dir = player.dir;
  if (Wd.kind === 'melee') {
    SFX.swing();
    const r = Wd.range;
    const box = { x: player.x + dir.x * (r * 0.5 + 6), y: player.y + dir.y * (r * 0.5 + 6), w: r * 1.1, h: r * 1.1 };
    let hitAny = false;
    for (const m of monsters) {
      if (!m.dead && overlap(box, m)) {
        const h = playerHit(Wd.dmg * mult);
        damageMonster(m, h.dmg, m.x - player.x, m.y - player.y, (Wd.knock || 1) * (h.crit ? 1.6 : 1), h.crit);
        hitAny = true;
      }
    }
    if (hitAny) addCombo();
    // cracked walls
    const tx0 = Math.floor((box.x - box.w / 2) / T), tx1 = Math.floor((box.x + box.w / 2) / T);
    const ty0 = Math.floor((box.y - box.h / 2) / T), ty1 = Math.floor((box.y + box.h / 2) / T);
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) if (tile(tx, ty) === CRACK) breakCrack(tx, ty);
    if (hitAny && w.key !== 'fists') useDurability(w);
  } else {
    if (Wd.kind === 'spell') SFX.spell(); else SFX.throw();
    projectiles.push({
      x: player.x + dir.x * 14, y: player.y + dir.y * 14, vx: dir.x * Wd.speed, vy: dir.y * Wd.speed,
      dmg: Wd.dmg * mult, friendly: true, wkey: w.key, slow: Wd.slow, glow: Wd.glow, color: Wd.glow || '#c3ccd6', r: 12, life: 1.4, rot: 0,
    });
    useDurability(w);
  }
}
function useDurability(w) {
  w.dur--;
  if (w.dur <= 0) {
    const i = player.weapons.indexOf(w);
    if (i >= 0) player.weapons.splice(i, 1);
    if (player.wi >= player.weapons.length) player.wi = Math.max(0, player.weapons.length - 1);
    floater(player.x, player.y - 40, WEAPONS[w.key].name + ' broke!', '#ff9a9a');
    SFX.break();
    for (let i = 0; i < 10; i++) particles.push({ x: player.x, y: player.y, vx: rnd(-160, 160), vy: rnd(-160, 160), life: 0.5, color: '#c3ccd6', s: 4 });
  }
}
function usePotion(type) {
  if (player.potions[type] <= 0) { floater(player.x, player.y - 40, 'No ' + POTIONS[type].name + '!', '#ff9a9a'); SFX.error(); return; }
  if (type === 'health') {
    if (player.hp >= player.maxHp) { floater(player.x, player.y - 40, 'Already full!', '#ffffff'); return; }
    player.hp = Math.min(player.maxHp, player.hp + 6);
  }
  if (type === 'speed') player.speedT = 10;
  if (type === 'strength') player.strT = 10;
  player.potions[type]--;
  SFX.potion();
  floater(player.x, player.y - 40, POTIONS[type].name + '!', '#ffffff');
}
function repairWithScrap() {
  const w = player.weapons[player.wi];
  if (!w) { floater(player.x, player.y - 40, 'No weapon to fix', '#ff9a9a'); return; }
  const max = WEAPONS[w.key].dur;
  if (w.dur >= max) { floater(player.x, player.y - 40, 'Not damaged!', '#ffffff'); return; }
  if (player.scrap <= 0) { floater(player.x, player.y - 40, 'No scrap metal!', '#ff9a9a'); SFX.error(); return; }
  w.dur = Math.min(max, w.dur + Math.ceil(max * 0.5));
  player.scrap--;
  SFX.chest();
  floater(player.x, player.y - 40, 'Repaired!', '#9be37a');
}
function dropWeapon() {
  const w = player.weapons[player.wi];
  if (!w) return;
  player.weapons.splice(player.wi, 1);
  if (player.wi >= player.weapons.length) player.wi = Math.max(0, player.weapons.length - 1);
  const it = spawnItem('weapon', player.x, player.y, { wkey: w.key, dur: w.dur });
  it.t = -2;
  floater(player.x, player.y - 40, 'Dropped ' + WEAPONS[w.key].name, '#ffffff');
}
function hurtPlayer(dmg, fx, fy) {
  if (player.inv > 0 || player.rollT > 0 || state !== 'play') return;
  if (player.combo >= 3) floater(player.x, player.y - 56, 'combo lost', '#ff9a9a');
  player.combo = 0; player.comboT = 0;
  const mult = [0.5, 1, 1.5][settings.difficulty];
  const d = Math.max(1, Math.round(dmg * mult));
  player.hp -= d;
  underAttack();
  player.inv = 0.9;
  const dx = player.x - fx, dy = player.y - fy, l = Math.hypot(dx, dy) || 1;
  player.kbx = dx / l * 380; player.kby = dy / l * 380;
  shake = 8;
  SFX.hurt();
  if (player.hp <= 0) { player.hp = 0; state = 'dead'; deadT = 0; lostCoins = Math.floor(player.coins * 0.25); }
}
function respawn() {
  player.coins -= lostCoins;
  player.hp = player.maxHp;
  player.x = (startRoom.x + startRoom.w / 2) * T;
  player.y = (startRoom.y + startRoom.h - 1.5) * T;
  player.inv = 1.5; player.kbx = player.kby = 0; player.speedT = player.strT = 0;
  projectiles = [];
  if (arena === 'closing' || arena === 'fight') {
    // the boss goes back into hiding and the doors open again
    monsters = monsters.filter(m => !m.boss && !inRoom(m, bossRoom));
    boss = null; arena = 'waiting';
    setGates(false);
  }
  for (const c of companions) { c.x = player.x; c.y = player.y; }
  state = 'play';
  showBanner('Back at the start. You can do this!', 3);
}
function interact() {
  if (shopObj && dist(player, shopObj) < 90) { state = 'shop'; shopIndex = 0; shopMsg = 'Welcome! What would you like?'; shopMsgT = 3; SFX.pickmenu(); return; }
  for (const c of chests) if (!c.open && !c.hidden && dist(player, c) < 66) { openChest(c); return; }
  for (const L of loreStones) if (dist(player, L) < 70) { state = 'reading'; readText = L.text; readT = 0; L.read = true; banner.t = 0; lastBlip = 0; SFX.menu(); return; }
}

// ---------- companions ----------
function updateCompanions(dt) {
  companions.forEach((c, i) => {
    c.t += dt; c.cd -= dt;
    const flying = !!MONSTERS[c.type].flying;
    let target = null, best = 240;
    for (const m of monsters) {
      if (m.dead) continue;
      const dm = dist(m, c);
      if (dist(m, player) < 320 && dm < best) { best = dm; target = m; }
    }
    let tx, ty;
    if (target) { tx = target.x; ty = target.y; }
    else {
      const a = i / companions.length * Math.PI * 2 + c.t * 0.4;
      tx = player.x + Math.cos(a) * 62; ty = player.y + Math.sin(a) * 52;
    }
    const dx = tx - c.x, dy = ty - c.y, l = Math.hypot(dx, dy);
    if (l > 8) {
      const s = target ? 200 : Math.min(280, l * 3);
      moveEntity(c, dx / l * s * dt, dy / l * s * dt, flying);
      c.moving = true;
    } else c.moving = false;
    if (Math.abs(dx) > 2) c.face = dx < 0 ? -1 : 1;
    if (target && l < target.w / 2 + 22 && c.cd <= 0) { damageMonster(target, c.dmg, dx, dy); c.cd = 0.8; }
    if (dist(c, player) > 450) { c.x = player.x; c.y = player.y; }
  });
}

// ---------- projectiles, particles ----------
function updateProjectiles(dt) {
  for (const p of projectiles) {
    p.life -= dt;
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += dt * 16;
    if (p.life <= 0) { p.dead = true; continue; }
    if (solidAt(p.x, p.y)) {
      p.dead = true;
      const tx = Math.floor(p.x / T), ty = Math.floor(p.y / T);
      if (p.friendly && tile(tx, ty) === CRACK) breakCrack(tx, ty);
      for (let i = 0; i < 5; i++) particles.push({ x: p.x, y: p.y, vx: rnd(-90, 90), vy: rnd(-90, 90), life: 0.3, color: p.color, s: 4 });
      continue;
    }
    if (p.friendly) {
      for (const m of monsters) {
        if (m.dead) continue;
        if (Math.abs(m.x - p.x) < m.w / 2 + p.r && Math.abs(m.y - p.y) < m.h / 2 + p.r) {
          const h = playerHit(p.dmg);
          damageMonster(m, h.dmg, p.vx, p.vy, h.crit ? 1.6 : 1, h.crit);
          addCombo();
          if (p.slow) m.slowT = 3;
          p.dead = true; break;
        }
      }
    } else if (Math.abs(player.x - p.x) < player.w / 2 + p.r - 4 && Math.abs(player.y - p.y) < player.h / 2 + p.r - 4) {
      hurtPlayer(p.dmg, p.x - p.vx, p.y - p.vy);
      p.dead = true;
    }
  }
  projectiles = projectiles.filter(p => !p.dead);
}
function updateParticles(dt) {
  for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.life -= dt; f.y -= 40 * dt; }
  floaters = floaters.filter(f => f.life > 0);
}

// ---------- saving ----------
function saveGame() {
  saveJSON('trials10_save', {
    seed: gameSeed, dungeon, maxHp: player.maxHp, coins: player.coins, scrap: player.scrap,
    weapons: player.weapons, wi: player.wi, potions: player.potions,
    companions: companions.map(c => ({ type: c.type, scheme: c.scheme, name: c.name, dmg: c.dmg })),
  });
}
function hasSave() { return !!loadJSON('trials10_save'); }
function newGame() {
  gameSeed = Math.floor(Math.random() * 1e9);
  dungeon = 1;
  player = newPlayer();
  companions = [];
  genDungeon(1);
  saveGame();
  state = 'story'; storyPage = 0; storyT = 0; lastBlip = 0;
}
function continueGame() {
  const s = loadJSON('trials10_save');
  if (!s) { newGame(); return; }
  gameSeed = s.seed; dungeon = s.dungeon;
  player = newPlayer();
  player.maxHp = s.maxHp; player.hp = s.maxHp; player.coins = s.coins; player.scrap = s.scrap;
  player.weapons = s.weapons || []; player.wi = s.wi || 0; player.potions = s.potions || player.potions;
  companions = (s.companions || []).filter(c => MONSTERS[c.type]).map(c => Object.assign({ x: 0, y: 0, w: 26, h: 26, cd: 0, t: Math.random() * 5, face: 1 }, c));

}
function nextDungeon() {
  dungeon++;
  SFX.stairs();
  genDungeon(dungeon);
  player.hp = Math.min(player.maxHp, player.hp + 4);
  saveGame();
  state = 'intro'; introT = 0;
}

// =====================================================================
// UPDATE (runs about 60 times a second)
// =====================================================================
function menuOptions() { return hasSave() ? ['Continue', 'New Game', 'Settings', 'How to Play'] : ['New Game', 'Settings', 'How to Play']; }
const PAUSE_OPTIONS = ['Resume', 'Settings', 'Save and Quit'];
const SETTINGS_ROWS = [
  { label: 'Sound effects', get: () => settings.sound ? 'ON' : 'OFF', change: () => { settings.sound = !settings.sound; } },
  { label: 'Music', get: () => settings.music ? 'ON' : 'OFF', change: () => { settings.music = !settings.music; } },
  { label: 'Volume', get: () => ['', 'LOW', 'MEDIUM', 'HIGH'][settings.volume], change: dir => { settings.volume = ((settings.volume - 1 + (dir || 1) + 3) % 3) + 1; applyVolume(); } },
  { label: 'Difficulty', get: () => ['EASY', 'NORMAL', 'HARD'][settings.difficulty], change: dir => { settings.difficulty = (settings.difficulty + (dir || 1) + 3) % 3; } },
  { label: 'Screen shake', get: () => settings.shake ? 'ON' : 'OFF', change: () => { settings.shake = !settings.shake; } },
  { label: 'Control hints', get: () => settings.hints ? 'ON' : 'OFF', change: () => { settings.hints = !settings.hints; } },
  { label: 'Delete saved game', get: () => hasSave() ? 'DELETE' : 'NONE', change: () => { removeKey('trials10_save'); } },
  { label: 'Back', get: () => '', change: null },
];

function update(dt) {
  time += dt;
  updateMusic(dt);
  updateMotes(dt);
  if (banner.t > 0) banner.t -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 30);
  switch (state) {
    case 'menu': {
      const opts = menuOptions();
      if (menuIndex >= opts.length) menuIndex = 0;
      if (P('arrowup', 'w')) { menuIndex = (menuIndex + opts.length - 1) % opts.length; SFX.menu(); }
      if (P('arrowdown', 's')) { menuIndex = (menuIndex + 1) % opts.length; SFX.menu(); }
      if (P('enter', ' ')) {
        SFX.pickmenu();
        const o = opts[menuIndex];
        if (o === 'New Game') newGame();
        else if (o === 'Continue') continueGame();
        else if (o === 'Settings') { state = 'settings'; settingsReturn = 'menu'; settingsIndex = 0; }
        else state = 'howto';
      }
      break;
    }
    case 'settings': {
      const n = SETTINGS_ROWS.length;
      if (P('arrowup', 'w')) { settingsIndex = (settingsIndex + n - 1) % n; SFX.menu(); }
      if (P('arrowdown', 's')) { settingsIndex = (settingsIndex + 1) % n; SFX.menu(); }
      const row = SETTINGS_ROWS[settingsIndex];
      if (P('escape') || (row.label === 'Back' && P('enter', ' '))) { state = settingsReturn; SFX.pickmenu(); saveSettings(); break; }
      if (row.change && P('enter', ' ', 'arrowright', 'd')) { row.change(1); saveSettings(); SFX.pickmenu(); }
      else if (row.change && P('arrowleft', 'a')) { row.change(-1); saveSettings(); SFX.pickmenu(); }
      break;
    }
    case 'howto':
      if (P('escape', 'enter', ' ')) { state = 'menu'; SFX.pickmenu(); }
      break;
    case 'story': {
      storyT += dt;
      const page = STORY_INTRO[storyPage];
      const shown = typed(page, storyT, 26);
      typingBlip(shown);
      if (P('escape')) { state = 'intro'; introT = 0; break; }
      if (P('enter', ' ', 'e')) {
        if (shown.length < page.length) storyT = 999;
        else if (++storyPage >= STORY_INTRO.length) { state = 'intro'; introT = 0; }
        else { storyT = 0; lastBlip = 0; SFX.menu(); }
      }
      break;
    }
    case 'reading': {
      readT += dt;
      const shown = typed(readText, readT, 30);
      typingBlip(shown);
      if (P('escape')) { state = 'play'; break; }
      if (P('enter', ' ', 'e')) {
        if (shown.length < readText.length) readT = 999;
        else state = 'play';
      }
      break;
    }
    case 'intro':
      introT += dt;
      if (introT > 4.5 || (introT > 0.4 && P('enter', ' '))) {
        state = 'play';
        if (dungeon === 1) showBanner('Find the boss to open the stairs. Visit the shop with E!', 5);
      }
      break;
    case 'play':
      if (hitStop > 0) { hitStop -= dt; break; }
      updatePlay(dt);
      break;
    case 'pause':
      if (P('escape')) { state = 'play'; break; }
      if (P('arrowup', 'w')) { pauseIndex = (pauseIndex + 2) % 3; SFX.menu(); }
      if (P('arrowdown', 's')) { pauseIndex = (pauseIndex + 1) % 3; SFX.menu(); }
      if (P('enter', ' ')) {
        SFX.pickmenu();
        if (pauseIndex === 0) state = 'play';
        else if (pauseIndex === 1) { state = 'settings'; settingsReturn = 'pause'; settingsIndex = 0; }
        else { saveGame(); state = 'menu'; menuIndex = 0; }
      }
      break;
    case 'shop': {
      if (shopMsgT > 0) shopMsgT -= dt;
      const n = shopStock.length;
      if (P('escape', 'e')) { state = 'play'; break; }
      if (P('arrowup', 'w')) { shopIndex = (shopIndex + n - 1) % n; SFX.menu(); }
      if (P('arrowdown', 's')) { shopIndex = (shopIndex + 1) % n; SFX.menu(); }
      if (P('enter', ' ')) buy(shopStock[shopIndex]);
      break;
    }
    case 'dead':
      deadT += dt;
      updateParticles(dt);
      if (deadT > 1 && P('enter', ' ')) respawn();
      break;
    case 'ending':
      endT += dt;
      if ((endT > 9 && P('enter', ' ')) || endT > 24) { state = 'menu'; menuIndex = 0; }
      break;
  }
  pressed.clear();
}

function updatePlay(dt) {
  if (P('escape', 'p')) { state = 'pause'; pauseIndex = 0; return; }
  player.cd = Math.max(0, player.cd - dt);
  player.inv = Math.max(0, player.inv - dt);
  player.swingT = Math.max(0, player.swingT - dt);
  player.speedT = Math.max(0, player.speedT - dt);
  player.strT = Math.max(0, player.strT - dt);
  player.rollCd = Math.max(0, player.rollCd - dt);
  if (player.comboT > 0) { player.comboT -= dt; if (player.comboT <= 0) player.combo = 0; }

  // dodge roll: SHIFT or K
  if (P('shift', 'k') && player.rollCd <= 0 && player.rollT <= 0) {
    player.rollT = ROLL_TIME; player.rollCd = ROLL_COOLDOWN;
    player.rollX = player.dir.x; player.rollY = player.dir.y;
    SFX.dodge();
  }
  if (player.rollT > 0) {
    player.rollT -= dt;
    moveEntity(player, player.rollX * ROLL_SPEED * dt, player.rollY * ROLL_SPEED * dt);
    particles.push({ x: player.x + rnd(-6, 6), y: player.y + rnd(-6, 12), vx: 0, vy: 0, life: 0.22, color: 'rgba(195,204,214,0.6)', s: 8 });
  }

  let mx = (D('d', 'arrowright') ? 1 : 0) - (D('a', 'arrowleft') ? 1 : 0);
  let my = (D('s', 'arrowdown') ? 1 : 0) - (D('w', 'arrowup') ? 1 : 0);
  player.moving = !!(mx || my);
  if (player.moving) {
    const l = Math.hypot(mx, my); mx /= l; my /= l;
    player.dir = { x: mx, y: my };
    if (mx) player.face = mx > 0 ? 1 : -1;
    player.anim += dt;
  }
  const spd = 170 * (player.speedT > 0 ? 1.6 : 1) * (player.rollT > 0 ? 0 : 1);
  moveEntity(player, (mx * spd + player.kbx) * dt, (my * spd + player.kby) * dt);
  player.kbx *= 0.85; player.kby *= 0.85;
  if (Math.abs(player.kbx) < 5) player.kbx = 0;
  if (Math.abs(player.kby) < 5) player.kby = 0;
  if (player.speedT > 0 && player.moving && Math.random() < 0.4) particles.push({ x: player.x + rnd(-10, 10), y: player.y + 14, vx: -mx * 40, vy: -my * 40, life: 0.3, color: '#5ac8e8', s: 4 });

  if (D(' ', 'j')) attack();
  if (P('q') && player.weapons.length > 1) {
    player.wi = (player.wi + 1) % player.weapons.length;
    floater(player.x, player.y - 40, WEAPONS[curWeapon().key].name, '#ffffff'); SFX.menu();
  }
  if (P('1')) usePotion('health');
  if (P('2')) usePotion('speed');
  if (P('3')) usePotion('strength');
  if (P('r')) repairWithScrap();
  if (P('g')) dropWeapon();
  if (P('e')) interact();
  if (state !== 'play') return;

  for (const m of monsters) if (!m.dead) updateMonster(m, dt);
  monsters = monsters.filter(m => !m.dead);
  updateCompanions(dt);
  updateProjectiles(dt);
  updateItems(dt);
  updateParticles(dt);

  updateArena(dt);
  if (exitObj && overlap(player, exitObj)) {
    if (exitObj.kind === 'door') { state = 'ending'; endT = 0; musicStep = 0; removeKey('trials10_save'); SFX.victory(); }
    else nextDungeon();
    return;
  }
  cam.x = clamp(player.x - W / 2, 0, MW * T - W);
  cam.y = clamp(player.y - H / 2, 0, MH * T - H);
}

// =====================================================================
// DRAWING
// =====================================================================
function text(str, x, y, size, color, align, shadow) {
  ctx.font = size + 'px ' + FONT;
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'top';
  if (shadow !== false) { ctx.fillStyle = '#000000'; ctx.fillText(str, x + Math.max(2, size / 8), y + Math.max(2, size / 8)); }
  ctx.fillStyle = color || '#ffffff';
  ctx.fillText(str, x, y);
}
function panel(x, y, w, h, border) {
  ctx.fillStyle = 'rgba(20,16,12,0.88)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = border || '#b58a1c';

}

const lightCanvas = makeCanvas(W, H);
const lctx = lightCanvas.getContext('2d');
// ---------- ATMOSPHERE: glowing spores, mist and dark edges ----------
const motes = [];
for (let i = 0; i < 70; i++) motes.push({ x: Math.random() * W, y: Math.random() * H, z: rnd(0.3, 1), ph: Math.random() * 10, warm: Math.random() < 0.15 });
let lastCamX = 0, lastCamY = 0;
function updateMotes(dt) {
  const inWorld = state === 'play' || state === 'reading' || state === 'shop' || state === 'pause' || state === 'dead';
  const dcx = inWorld ? cam.x - lastCamX : 0, dcy = inWorld ? cam.y - lastCamY : 0;
  lastCamX = cam.x; lastCamY = cam.y;
  for (const m of motes) {
    m.ph += dt;
    m.x -= dcx * m.z;
    m.x += Math.sin(m.ph * 0.7) * 10 * m.z * dt;
    m.y += (-6 - 8 * m.z) * dt - dcy * m.z;
    if (m.x < -10) m.x += W + 20; if (m.x > W + 10) m.x -= W + 20;
    if (m.y < -10) m.y += H + 20; if (m.y > H + 10) m.y -= H + 20;
  }
}
// a soft misty texture, made once
const fogCanvas = makeCanvas(512, 512);
(function () {
  const f = fogCanvas.getContext('2d');
  for (let i = 0; i < 40; i++) {
    const x = Math.random() * 512, y = Math.random() * 512, r = rnd(60, 160);
    for (const ox of [-512, 0, 512]) for (const oy of [-512, 0, 512]) {
      const g = f.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r);
      g.addColorStop(0, 'rgba(140,175,185,0.07)'); g.addColorStop(1, 'rgba(140,175,185,0)');
      f.fillStyle = g; f.fillRect(x + ox - r, y + oy - r, r * 2, r * 2);
    }
  }
})();
const vignette = makeCanvas(W, H);
(function () {
  const v = vignette.getContext('2d');
  const g = v.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.7)');
  v.fillStyle = g; v.fillRect(0, 0, W, H);
})();
function drawFog(alpha, inWorld) {
  ctx.globalAlpha = alpha;
  for (const [speed, par] of [[8, 0.35], [-5, 0.6]]) {
    const ox = -(((time * speed + (inWorld ? cam.x * par : 0)) % 512) + 512) % 512;
    const oy = -(((time * 2 + (inWorld ? cam.y * par : 0)) % 512) + 512) % 512;
    for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(fogCanvas, x, y);
  }
  ctx.globalAlpha = 1;
}
function drawMotes(strength) {
  ctx.globalCompositeOperation = 'lighter';
  for (const m of motes) {
    const tw = (0.5 + 0.5 * Math.sin(m.ph * 2.3)) * strength;
    const col = m.warm ? '255,190,120' : '150,230,220';
    const r = 6 + m.z * 8;
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, r);
    g.addColorStop(0, 'rgba(' + col + ',' + (0.35 * tw) + ')'); g.addColorStop(1, 'rgba(' + col + ',0)');
    ctx.fillStyle = g; ctx.fillRect(m.x - r, m.y - r, r * 2, r * 2);
    const s = m.z > 0.7 ? 3 : 2;
    ctx.fillStyle = 'rgba(' + col + ',' + (0.9 * tw) + ')';
    ctx.fillRect(Math.round(m.x) - 1, Math.round(m.y) - 1, s, s);
  }
  ctx.globalCompositeOperation = 'source-over';
}
function drawAtmosphere(glows) {
  ctx.globalCompositeOperation = 'lighter';
  for (const G of glows || []) {
    if (G.x < -G.r || G.y < -G.r || G.x > W + G.r || G.y > H + G.r) continue;
    const g = ctx.createRadialGradient(G.x, G.y, 0, G.x, G.y, G.r);
    g.addColorStop(0, 'rgba(' + G.color + ',' + G.a + ')'); g.addColorStop(1, 'rgba(' + G.color + ',0)');
    ctx.fillStyle = g; ctx.fillRect(G.x - G.r, G.y - G.r, G.r * 2, G.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  drawFog(0.75, true);
  drawMotes(1);
  ctx.drawImage(vignette, 0, 0);
}

// ---------- typing text, one letter at a time ----------
function typed(str, t, speed) {
  const n = Math.min(str.length, Math.floor(t * (speed || 32)));
  return str.slice(0, n);
}
let lastBlip = 0;
function typingBlip(shown) {
  if (shown.length > lastBlip) {
    const ch = shown[shown.length - 1];
    if (ch && ch !== ' ' && shown.length % 2 === 0) tone(180 + Math.random() * 30, 0.035, 'triangle', 0.12);
  }
  lastBlip = shown.length;
}
function wrapLines(str, maxW, size) {
  ctx.font = size + 'px ' + FONT;
  const words = str.split(' '), out = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { out.push(line); line = w; } else line = test;
  }
  if (line) out.push(line);
  return out;
}
// draws typed text, keeping each word where it will end up
function drawTyped(full, shownCount, x, y, maxW, size, color, align, lineH) {
  const lines = wrapLines(full, maxW, size);
  let left = shownCount;
  lines.forEach((l, i) => {
    const part = l.slice(0, Math.max(0, left));
    left -= l.length + 1;
    if (!part) return;
    if (align === 'center') {
      ctx.font = size + 'px ' + FONT;
      const fullW = ctx.measureText(l).width;
      text(part, x - fullW / 2, y + i * lineH, size, color, 'left');
    } else text(part, x, y + i * lineH, size, color, 'left');
  });
}

function drawLighting(lights) {
  lctx.globalCompositeOperation = 'source-over';
  lctx.clearRect(0, 0, W, H);
  lctx.fillStyle = 'rgba(4,8,13,' + Math.min(0.86, 0.66 + dungeon * 0.02) + ')';
  lctx.fillRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-out';
  for (const L of lights) {
    if (L.x < -L.r || L.y < -L.r || L.x > W + L.r || L.y > H + L.r) continue;
    const g = lctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.55, 'rgba(0,0,0,0.75)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = g;
    lctx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  ctx.drawImage(lightCanvas, 0, 0);
}

function drawWorld() {

  // chests
  for (const c of chests) {
    if (c.hidden) continue;
    drawSpr(chestSprite(c), c.x, c.y, c.boss ? 64 : 48);
    if (c.secret && !c.open) lights.push({ x: c.x + ox, y: c.y + oy, r: 90 });
  }

  // items on the floor
  for (const it of items) {
    const bob = Math.sin(time * 5 + it.x) * 3;
    let s = null, size = 32;
    if (it.kind === 'coin') s = spr('coin');
    else if (it.kind === 'potion') s = potionSprite(it.ptype);
    else if (it.kind === 'scrap') s = spr('scrap');
    else if (it.kind === 'heart') { s = spr('heart'); size = 40; }
    else if (it.kind === 'weapon') { s = weaponSprite(it.wkey); size = 40; }
    if (s) drawSpr(s, it.x, it.y + bob, size);
  }

  // monsters, buddies and the knight, drawn from back to front
  const actors = [];
  for (const m of monsters) actors.push({ y: m.y, draw: () => drawMonster(m) });
  for (const c of companions) actors.push({ y: c.y, draw: () => drawCompanion(c) });
  actors.push({ y: player.y, draw: drawKnight });
  actors.sort((a, b) => a.y - b.y);
  for (const a of actors) a.draw();

  // projectiles
  for (const p of projectiles) {
    if (p.friendly && p.wkey) {
      const Wd = WEAPONS[p.wkey];
      if (Wd.kind === 'throw') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        drawSpr(weaponSprite(p.wkey), 0, 0, 30);
        ctx.restore();
      } else {
        drawSpr(weaponSprite(p.wkey), p.x, p.y, 32);
        lights.push({ x: p.x + ox, y: p.y + oy, r: 80 });
      }
    } else {
      ctx.fillStyle = '#1b1b24';
      ctx.fillRect(p.x - 9, p.y - 9, 18, 18);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 7, p.y - 7, 14, 14);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(p.x - 4, p.y - 4, 5, 5);
      lights.push({ x: p.x + ox, y: p.y + oy, r: 50 });
    }
  }

  // particles and numbers
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life * 2); text(f.text, f.x, f.y, f.size || 10, f.color, 'center'); }
  ctx.globalAlpha = 1;

  // "press E" prompts
  if (state === 'play') {
    if (shopObj && dist(player, shopObj) < 90) prompt(shopObj.x, shopObj.y - 84, 'E  SHOP');
    else if (chests.some(c => !c.open && !c.hidden && dist(player, c) < 66)) { const c = chests.find(c => !c.open && !c.hidden && dist(player, c) < 66); prompt(c.x, c.y - 44, 'E  OPEN'); }
    else for (const L of loreStones) if (dist(player, L) < 70) { prompt(L.x, L.y - 50, 'E  READ'); break; }
  }
  ctx.restore();
  drawLighting(lights);
  drawAtmosphere(glows);
}
function prompt(x, y, label) {

function drawKnight() {
  if (player.inv > 0 && Math.floor(player.inv * 15) % 2 === 0) return;
  const frame = player.moving && Math.floor(player.anim * 8) % 2 ? 'knight_b' : 'knight_a';
  const flip = player.face < 0;
  if (player.rollT > 0) {
    // tumble while dodging
    ctx.save(); ctx.globalAlpha = 0.75;
    ctx.translate(player.x, player.y - 6);
    ctx.rotate((1 - player.rollT / ROLL_TIME) * Math.PI * 2 * (player.rollX < 0 ? -1 : 1));
    drawSpr(spr(frame), 0, 0, 44, flip);
    ctx.restore();
    return;
  }
  drawSpr(spr(frame), player.x, player.y - 6, 48, flip);
  if (player.strT > 0) { ctx.strokeStyle = 'rgba(240,160,32,0.6)'; ctx.lineWidth = 2; ctx.strokeRect(player.x - 22, player.y - 30, 44, 50); }
  // the weapon in his hand
  const w = curWeapon();
  const ws = weaponSprite(w.key);
  if (!ws) return;
  const base = Math.atan2(player.dir.y, player.dir.x);
  if (player.swingT > 0 && WEAPONS[w.key].kind === 'melee') {
    const p = 1 - player.swingT / 0.18;
    const ang = base - 1.3 + p * 2.6;
    const r = WEAPONS[w.key].range;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 * (1 - p)) + ')';
    ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(player.x, player.y, r * 0.75, base - 1.3, ang); ctx.stroke();
    ctx.save();
    ctx.translate(player.x + Math.cos(ang) * 24, player.y + Math.sin(ang) * 24);
    ctx.rotate(ang + Math.PI / 4);
    drawSpr(ws, 0, 0, 40);
    ctx.restore();
  } else {
    drawSpr(ws, player.x + player.face * 18, player.y + 2, 30, flip);
  }
}
function drawMonster(m) {
  const M = MONSTERS[m.type];
  let frame = Math.floor(m.t * 5) % 2;
  if (m.ai === 'hop') frame = (m.t * 1.6) % 1 < 0.5 ? 0 : 1;
  const size = M.px ? M.px * 16 : m.boss ? (m.final ? 150 : 144) : 48;
  // his monsters keep their drawing and move by bouncing and bobbing
  let bob = 0;
  if (M.own) bob = M.flying ? Math.sin(m.t * 9) * 5 : (m.moving ? -Math.abs(Math.sin(m.t * (m.ai === 'hop' ? 6 : 11))) * (m.ai === 'hop' ? 12 : 5) : 0);
  const flip = player.x < m.x;
  // winding up for a lunge: shake and show a warning
  let shakeX = 0;
  if (m.windup > 0) {
    shakeX = Math.sin(m.t * 60) * 3;
    ctx.save(); ctx.translate(shakeX, 0);
    text('!', m.x, m.y - m.h / 2 - 30, 16, '#ff4a3a', 'center');
    ctx.fillStyle = 'rgba(255,60,60,' + (0.15 + 0.15 * Math.sin(m.t * 30)) + ')';
    ctx.beginPath(); ctx.arc(m.x, m.y, m.w * 0.7, 0, Math.PI * 2); ctx.fill();
  }

  if (m.boss && m.charge > 0) { ctx.fillStyle = 'rgba(255,60,60,0.25)'; ctx.fillRect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h); }
  if (M.anim) drawAnimated(monsterSprite(m.type, m.scheme, frame), m.x, m.y - (m.boss ? 10 : 4) + (M.drawY || 0) + bob, size, flip, M.anim, m.t, m.moving, m.flash > 0);
  else drawSpr(monsterSprite(m.type, m.scheme, frame), m.x, m.y - (m.boss ? 10 : 4) + (M.drawY || 0) + bob, size, flip);
  ctx.globalAlpha = 1;
  if (m.windup > 0) ctx.restore();
  if (m.slowT > 0) { ctx.fillStyle = 'rgba(138,224,255,0.3)'; ctx.fillRect(m.x - m.w / 2, m.y - m.h / 2, m.w, m.h); }
  if (!m.boss && m.hp < m.maxHp) {

  }
}
// ---------- monster animations ----------
// Draws one of his monsters with movement, without changing his pixels.
function drawAnimated(s, x, y, size, flip, A, t, moving, hurt) {
  const img = flip ? s.l : s.r;
  const ps = size / 16, iw = img.width, ih = img.height, w = iw * ps, h = ih * ps;
  let sx = 1, sy = 1, rot = 0, dx = 0;
  switch (A.type) {
    case 'squash': { const p = Math.sin(t * (moving ? 12 : 5)); sx = 1 + 0.12 * p; sy = 1 - 0.12 * p; break; }
    case 'jelly':  { const p = Math.sin(t * 7); sx = 1 + 0.1 * p; sy = 1 - 0.07 * p; rot = Math.sin(t * 3.5) * 0.05; break; }
    case 'rock':   rot = Math.sin(t * (moving ? 16 : 4)) * (moving ? 0.25 : 0.08); break;
    case 'waddle': rot = Math.sin(t * (moving ? 12 : 3)) * (moving ? 0.14 : 0.04); dx = Math.sin(t * 12) * (moving ? 1.5 : 0); break;
    case 'buzz':   rot = Math.sin(t * 8) * 0.06; dx = Math.sin(t * 50) * 1.2; break;
    case 'stomp':  { const p = Math.sin(t * 2.2); sy = 1 + 0.035 * p; sx = 1 - 0.02 * p; if (moving) rot = Math.sin(t * 5) * 0.035; break; }
  }
  if (hurt) { sx *= 1.15; sy *= 0.85; }
  ctx.save();
  // everything squashes and tips from the feet
  ctx.translate(Math.round(x + dx), Math.round(y + h / 2));
  ctx.rotate(rot);
  ctx.scale(sx, sy);
  const left = -w / 2, top = -h;
  if (A.type === 'flap') {
    // cut the picture into: left wing | body | right wing
    const L = flip ? iw - A.right : A.left, R = flip ? iw - A.left : A.right;
    const a = Math.sin(t * A.speed) * A.amount;
    const py = A.pivotY * ps;
    ctx.save(); ctx.translate(left + L * ps, top + py); ctx.rotate(a);
    ctx.drawImage(img, 0, 0, L, ih, -L * ps, -py, L * ps, h); ctx.restore();
    ctx.save(); ctx.translate(left + R * ps, top + py); ctx.rotate(-a);
    ctx.drawImage(img, R, 0, iw - R, ih, 0, -py, (iw - R) * ps, h); ctx.restore();
    ctx.drawImage(img, L, 0, R - L, ih, left + L * ps, top, (R - L) * ps, h);
  } else if (A.type === 'buzz') {
    // the top rows are wings: squash them up and down super fast
    const wr = A.wingRows, wy = 0.35 + 0.65 * Math.abs(Math.sin(t * 30));
    ctx.drawImage(img, 0, wr, iw, ih - wr, left, top + wr * ps, w, (ih - wr) * ps);
    ctx.drawImage(img, 0, 0, iw, wr, left, top + wr * ps * (1 - wy), w, wr * ps * wy);
  } else {
    ctx.drawImage(img, left, top, w, h);
  }
  ctx.restore();
}
function drawCompanion(c) {
  const frame = Math.floor(c.t * 5) % 2;
  const bob = Math.sin(c.t * 5) * 2;
  const CA = MONSTERS[c.type].anim;
  if (CA) drawAnimated(monsterSprite(c.type, c.scheme, frame), c.x, c.y + bob, 36, c.face < 0, CA, c.t, c.moving, false);

  ctx.fillStyle = '#ff6a8a';
  ctx.fillRect(c.x - 4, c.y - 26 + bob, 3, 3); ctx.fillRect(c.x + 1, c.y - 26 + bob, 3, 3);
  ctx.fillRect(c.x - 4, c.y - 23 + bob, 8, 3); ctx.fillRect(c.x - 2, c.y - 20 + bob, 4, 2);
}

  shopStock.forEach((it, i) => {
    const y = py + 96 + i * 50, sel = i === shopIndex;
    if (sel) { ctx.fillStyle = 'rgba(240,200,60,0.15)'; ctx.fillRect(px + 14, y - 6, pw - 28, 44); }
    const s = it.icon();
    if (s) ctx.drawImage(s.r, px + 24, y - 4, 40, 40);
    text(it.label, px + 76, y + 8, 12, it.sold ? '#6a6a5a' : sel ? '#ffffff' : '#c3ccd6');
    const price = it.price();
    const ptxt = it.sold ? 'SOLD' : price === null ? '-' : String(price);
    text(ptxt, px + pw - 30, y + 8, 12, player.coins >= (price || 0) && !it.sold ? '#f0c83c' : '#8a6a3a', 'right');
  });
  const sel = shopStock[shopIndex];
  text(sel.desc, W / 2, py + ph - 70, 9, '#c3ccd6', 'center');
  if (shopMsgT > 0) text(shopMsg, W / 2, py + ph - 48, 10, '#9be37a', 'center');
  text('Enter: buy   Esc: leave', W / 2, py + ph - 24, 9, '#f0c83c', 'center');
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, 180, 36, '#f0c83c', 'center');
  PAUSE_OPTIONS.forEach((o, i) => {
    const sel = i === pauseIndex;
    text((sel ? '> ' : '  ') + o + (sel ? ' <' : '  '), W / 2, 280 + i * 50, 16, sel ? '#ffffff' : '#9a9a8a', 'center');
  });
}
function drawDead() {
  ctx.fillStyle = 'rgba(120,0,0,' + Math.min(0.6, deadT) + ')';
  ctx.fillRect(0, 0, W, H);
  text('YOU FELL...', W / 2, 220, 36, '#ffffff', 'center');
  if (lostCoins > 0) text('You dropped ' + lostCoins + ' coins.', W / 2, 290, 12, '#f0c83c', 'center');
  if (deadT > 1) text('Press Enter to try again from the start of this dungeon', W / 2, 340, 10, '#ffffff', 'center');
}

// ---------- the ending ----------
function drawEnding() {
  const t = endT;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#4aa8ea'); g.addColorStop(1, '#cdeeff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // sun
  ctx.fillStyle = '#ffe066';
  for (let i = -5; i <= 5; i++) { const h = Math.round(Math.sqrt(36 - i * i)) * 8; ctx.fillRect(800 + i * 8 - 4, 110 - h, 8, h * 2); }
  // clouds
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < 4; i++) {
    const cx = ((i * 290 + t * 22) % (W + 300)) - 150, cy = 70 + i * 36;
    ctx.fillRect(cx, cy, 120, 24); ctx.fillRect(cx + 24, cy - 16, 64, 16);
  }
  // hills and grass
  ctx.fillStyle = '#7ccf6a';
  for (let x = 0; x < W; x += 8) { const h = 60 + Math.sin(x / 90) * 30; ctx.fillRect(x, 470 - h, 8, h); }
  ctx.fillStyle = '#5fbf4a'; ctx.fillRect(0, 470, W, H - 470);
  ctx.fillStyle = '#4a9a3a';
  for (let i = 0; i < 80; i++) { const x = (i * 97) % W, y = 480 + (i * 53) % 150; ctx.fillRect(x, y, 6, 6); }
  for (let i = 0; i < 30; i++) { const x = (i * 173) % W, y = 490 + (i * 71) % 140; ctx.fillStyle = ['#ffffff', '#f0c83c', '#f07aa8'][i % 3]; ctx.fillRect(x, y, 8, 8); }
  // the dungeon you escaped from
  for (let gy = 0; gy < 6; gy++) for (let gx = 0; gx < 4; gx++) {
    ctx.drawImage(mossyTile('walls', hash(gx, gy)), 20 + gx * T, 182 + gy * T, T, T);
  }
  ctx.fillStyle = '#080a07'; ctx.fillRect(68, 374, 96, 96);
  // the knight runs free!
  const kx = 116 + Math.max(0, t - 0.8) * 150;
  if (t > 0.8 && kx < W + 80) {
    drawSpr(spr(Math.floor(t * 8) % 2 ? 'knight_a' : 'knight_b'), kx, 432 + Math.abs(Math.sin(t * 10)) * -6, 96);
    companions.forEach((c, i) => {
      const cx = kx - 80 * (i + 1);
      if (cx > 116) drawSpr(monsterSprite(c.type, c.scheme, Math.floor(t * 6) % 2), cx, 448 + Math.sin(t * 8 + i) * 6, 56);
    });
  }
  if (t > 2.5 && t < 9) text('FREE AT LAST!', W / 2, 30, 28, '#ffffff', 'center');
  if (t > 8) {
    ctx.fillStyle = 'rgba(0,0,0,' + Math.min(0.7, (t - 8) * 0.4) + ')'; ctx.fillRect(0, 0, W, H);
    text('YOU COMPLETED', W / 2, 170, 28, '#ffffff', 'center');
    text('THE TRIALS OF 10!', W / 2, 220, 32, '#f0c83c', 'center');
    if (companions.length) text('with ' + companions.length + ' loyal buddies at your side', W / 2, 300, 12, '#9be37a', 'center');
    text('Thanks for playing, brave knight.', W / 2, 340, 12, '#ffffff', 'center');
    if (t > 9) text('Press Enter for the main menu', W / 2, 420, 10, '#c3ccd6', 'center');
  }
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  switch (state) {
    case 'menu': drawMenu(); break;
    case 'settings': settingsReturn === 'pause' ? (drawWorld(), drawHUD(), ctx.fillStyle = 'rgba(0,0,0,0.75)', ctx.fillRect(0, 0, W, H), drawSettingsOverlay()) : drawSettings(); break;
    case 'howto': drawHowTo(); break;
    case 'intro': drawIntro(); break;
    case 'story': drawStory(); break;
    case 'reading': drawWorld(); drawHUD(); drawReading(); break;
    case 'play': drawWorld(); drawHUD(); break;
    case 'pause': drawWorld(); drawHUD(); drawPause(); break;
    case 'shop': drawShop(); break;
    case 'dead': drawWorld(); drawHUD(); drawDead(); break;
    case 'ending': drawEnding(); break;
  }
}
function drawSettingsOverlay() {
  text('SETTINGS', W / 2, 60, 32, '#f0c83c', 'center');
  SETTINGS_ROWS.forEach((r, i) => {
    const sel = i === settingsIndex, y = 150 + i * 50;
    const col = sel ? '#ffffff' : '#9a9a8a';
    if (r.label === 'Back') { text((sel ? '> ' : '') + 'Back', W / 2, y, 14, col, 'center'); return; }
    text((sel ? '> ' : '  ') + r.label, 160, y, 14, col);
    text(r.get(), W - 160, y, 14, sel ? '#f0c83c' : '#9a9a8a', 'right');
  });
}

// ---------- the game loop ----------
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
